<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FlatMatch Admin</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/admin.css">
<script src="/static/admin.js" defer></script>
</head>
<body>
<section id="login" class="login hidden">
  <form id="loginForm" class="box">
    <div class="logo">FM</div><h1>Admin</h1>
    <input type="password" name="password" placeholder="Admin password" autocomplete="current-password" maxlength="256" required>
    <p class="err" id="loginErr"></p>
    <button class="btn primary" type="submit">Log in</button>
  </form>
</section>

<section id="panel" class="hidden">
  <header class="top">
    <b>FlatMatch Admin</b><span class="dbtag" id="dbTag"></span>
    <button class="btn small ghost" id="logout">Log out</button>
  </header>
  <nav class="tabs">
    <button data-tab="dash" class="active">Dashboard</button>
    <button data-tab="users">Users</button>
    <button data-tab="reports">Reports</button>
  </nav>

  <main>
    <div id="t-dash" class="tab-view">
      <div class="stats" id="stats"></div>
      <h3>Top cities</h3>
      <div id="cities" class="cities"></div>
    </div>

    <div id="t-users" class="tab-view hidden">
      <form id="searchForm" class="search">
        <input id="q" placeholder="Search name, email or city" maxlength="60">
        <button class="btn small primary">Search</button>
      </form>
      <div class="tablewrap"><table id="usersTable">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Age</th><th>City / Area</th><th>Budget (Rs)</th><th>Type</th><th>Matches</th><th>Reported</th><th>Joined</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="pager"><button class="btn small ghost" id="prev">Prev</button><span id="pageInfo"></span><button class="btn small ghost" id="next">Next</button></div>
    </div>

    <div id="t-reports" class="tab-view hidden">
      <div class="tablewrap"><table id="reportsTable">
        <thead><tr><th>When</th><th>Reported user</th><th>Reported by</th><th>Reason</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <p class="empty hidden" id="noReports">No reports or blocks yet.</p>
    </div>
  </main>
</section>

<div id="drawer" class="drawer hidden"><div class="drawer-body" id="drawerBody"></div></div>
<div id="toast" class="toast hidden"></div>
</body>
</html>
